name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The filesystem defences this tool relies on are platform behaviour, so all three run.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage gate
        shell: pwsh
        run: ./build/Test-Coverage.ps1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/**/coverage.cobertura.xml

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Analyse this repository with itself
        run: dotnet run --project src/DupDetector.Cli -c Release -- src --format yaml --output artifacts/self-report.yaml --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: self-report
          path: artifacts/self-report.yaml