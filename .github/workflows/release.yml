name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    name: Pack & Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from the tag
        id: version
        shell: pwsh
        run: |
          $value = $env:GITHUB_REF_NAME -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$value"

      - name: Test with coverage gate
        shell: pwsh
        run: ./build/Test-Coverage.ps1

      - name: Pack
        run: >
          dotnet pack src/DupDetector.Cli/DupDetector.Cli.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Publish to NuGet
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: >
          dotnet nuget push artifacts/nupkg/*.nupkg
          --api-key "$env:NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate